name = "ama"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# カスタムドメインで運用する。workers.dev を有効にすると同じ内容が
# 2つの URL で公開され検索インデックスが重複するため無効にする。
workers_dev = false

# カスタムドメイン 4rnay.net は初回セットアップ時に一度だけ割り当て済み。
# ここに routes を宣言すると wrangler が /zones/*/workers/routes を叩くため、
# CI トークンに Zone:Workers Routes:Edit が必要になる。public リポジトリの
# シークレットに持たせる権限は絞りたいので宣言しない。
# 宣言を外しても既存のカスタムドメインは維持されることを実測で確認済み。
# 再割当が必要になった場合は下記を一時的に有効化してローカルからデプロイする:
#   routes = [{ pattern = "4rnay.net", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "ama"
# `pnpm cf d1 create ama` で作成 (region: APAC)
database_id = "498ed0ae-3a98-4224-89b1-b828e96a7ed0"
migrations_dir = "migrations"

# 月次で古い like_locks を掃除する
[triggers]
crons = ["0 4 1 * *"]

# Like API の連打抑止(IP あたり 30回/分)
[[unsafe.bindings]]
name = "RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
