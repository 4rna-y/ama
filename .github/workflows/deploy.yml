name: deploy

on:
  # 記事リポジトリ (4rna-y/ama-cont) からの通知
  repository_dispatch:
    types: [content-updated]
  # テーマ・ビルド設定の変更
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ama は public。fork からの PR にはシークレットが渡らずどのみち失敗するうえ、
    # 未信頼のコードを CI で実行することになるので同一リポジトリの PR だけを対象にする。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: 4rna-y/ama-cont
          path: content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 内容が変わっていない記事の OGP は再生成しない
      - name: Restore OGP cache
        uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-${{ hashFiles('content/posts/**/*.md', 'content/posts/**/*.mdx', 'src/lib/og.ts') }}
          restore-keys: og-

      - name: Build
        run: pnpm build
        env:
          # PR プレビューでは下書きも確認できるようにする
          INCLUDE_DRAFTS: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        run: pnpm cf d1 migrations apply ama --remote

      - name: Deploy (production)
        if: github.event_name != 'pull_request'
        run: pnpm cf deploy

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        run: pnpm cf versions upload
